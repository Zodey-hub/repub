[package]
name = "repub"
version = "0.1.0"
edition = "2024"
authors = ["Bálint Máté <balint.mate.2006@gmail.com>"]
description = "Search and download EPUB books"
repository = "https://github.com/Zodey-hub/repub"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["epub", "ebook", "search", "library", "http"]
categories = ["web-programming"]

[dependencies]
anyhow = "1"
build_html = { version = "2.8", git = "https://github.com/Zodey-hub/build_html" } # until the form tags are released upstream
epub = "2"
fnv = "1"
http = "1"
jiff = "1"
log = { version = "0.4", features = ["std"] }
percent-encoding = "2"
pico-args = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-database = "2"
tiny-http-server = "2"
unicode-normalization = "0.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
strip = true
opt-level = 3
codegen-units = 1
